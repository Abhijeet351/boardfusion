name: Android app

on:
  workflow_dispatch:
    inputs:
      release_apk_url:
        description: "Optional: URL of a signed release APK to also install and screenshot"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build APKs (debug + unsigned release)
        run: bash android-app/build.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RELEASE_APK_URL: ${{ github.event.inputs.release_apk_url }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            bash android-app/ci/emulator-test.sh; echo $? > android-app/ci/shots/result.txt
            if [ -n "$RELEASE_APK_URL" ]; then curl -fsSL -o /tmp/release.apk "$RELEASE_APK_URL" && adb uninstall com.boardfusion.app; adb install /tmp/release.apk && adb shell am start -W -n com.boardfusion.app/.MainActivity && sleep 6 && adb exec-out screencap -p > android-app/ci/shots/20-release-6s.png && sleep 30 && adb exec-out screencap -p > android-app/ci/shots/21-release-36s.png && adb shell pidof com.boardfusion.app && echo "RELEASE APK installed and running"; fi

      - name: Publish test screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd android-app/ci/shots || exit 0
          gh release view android-ci >/dev/null 2>&1 || gh release create android-ci --prerelease --title "Android CI test screenshots" --notes "Screenshots from the latest Android emulator test run. Not an app release."
          gh release upload android-ci ./* --clobber

      - name: Fail if tests failed
        run: test "$(cat android-app/ci/shots/result.txt 2>/dev/null)" = "0"
